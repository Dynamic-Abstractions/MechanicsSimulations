*{box-sizing:border-box}
html,body{height:100%}

header .sub{color:var(--muted);font-size:12.5px}
.themes{display:flex;gap:4px;margin-left:auto;align-items:center;flex-wrap:wrap;font-size:12.5px;color:var(--muted)}

.themes span.cur{background:var(--ink);color:#fff;border-color:var(--ink)}
nav{display:flex;gap:2px;overflow-x:auto;margin-top:8px;scrollbar-width:thin}
nav button{font:inherit;font-size:13.5px;border:0;border-bottom:3px solid transparent;background:none;color:var(--muted);padding:8px 12px 7px;cursor:pointer;white-space:nowrap}
nav button:hover{color:var(--ink)}
nav button.on{color:var(--ink);border-bottom-color:var(--ink);font-weight:650}
.btn{font:inherit;font-size:13.5px;border:1px solid var(--line);background:#fff;color:var(--ink);padding:7px 12px;border-radius:8px;cursor:pointer}
.btn:hover{background:#f1f0ea}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:#363e46}
#langBtn{font:inherit;font-size:12.5px;padding:4px 9px;border-radius:7px;border:1px solid var(--line);background:#fff;cursor:pointer}
main{flex:1;min-height:0;position:relative}
.scene{position:absolute;inset:0;display:none;grid-template-columns:1fr 370px}
.scene.on{display:grid}
.stage{display:flex;flex-direction:column;min-width:0;min-height:0;padding:12px;gap:10px}
.cvwrap{position:relative;flex:1;min-height:240px;background:#fff;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.cvwrap.graph{flex:0 0 190px;min-height:150px}
.cvwrap canvas{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
.side{overflow:auto;border-left:1px solid var(--line);background:var(--panel);padding:16px 18px 30px}
.side h2{font-size:17px;margin:0 0 8px}
.concept{font-size:14px;line-height:1.5;color:#2a3138}
.concept p{margin:0 0 8px}
.eq{font-family:"Cambria Math","STIX Two Math",Georgia,serif;font-size:17px;text-align:center;background:#f6f5f0;border-radius:8px;padding:8px;margin:8px 0;line-height:1.6}
.eq b{font-weight:700}
h3{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin:18px 0 8px}
.ctrls{display:flex;flex-direction:column;gap:8px}
.btns{display:flex;flex-wrap:wrap;gap:6px}
.row{display:grid;grid-template-columns:118px 1fr 70px;align-items:center;gap:8px;font-size:13.5px}
.row output{font-variant-numeric:tabular-nums;text-align:right;font-size:13px}
.row input[type=range]{width:100%}
.chk{display:flex;align-items:center;gap:8px;font-size:13.5px;cursor:pointer}
.radios{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13.5px}
table.ro{width:100%;border-collapse:collapse;font-size:12.8px;font-variant-numeric:tabular-nums}
table.ro th,table.ro td{padding:4px 5px;border-bottom:1px solid #eeede7;text-align:right}
table.ro th:first-child,table.ro td:first-child{text-align:left}
table.ro th{color:var(--muted);font-weight:600}
table.ro tr.sum td{font-weight:700}
.try{font-size:13.5px;line-height:1.5;padding-left:18px;margin:0}
.try li{margin-bottom:5px}
.legend{display:flex;flex-wrap:wrap;gap:10px;font-size:12.5px;color:var(--muted)}
.legend span::before{content:"";display:inline-block;width:14px;height:4px;border-radius:2px;margin-right:5px;vertical-align:middle;background:var(--c)}
.hint{font-size:12.5px;color:var(--muted)}
@media (max-width:900px){
  .scene{position:static;grid-template-columns:1fr}
  .scene.on{display:block}
  .stage{height:72vh}
  .side{border-left:0;border-top:1px solid var(--line)}
  main{overflow:auto}
}

<body>
<header>
  <div class="top">
    <div>
      <h1 data-es="Tema 4 · Cinemática de la rotación" data-en="Theme 4 · Rotational kinematics"></h1>
      <div class="sub" data-es="Mecánica para Ingeniería — simulaciones interactivas" data-en="Mechanics for Engineering — interactive simulations"></div>
    </div>
    <div class="themes"><span data-es="Temas:" data-en="Themes:"></span><a href="t1.html" target="_top" data-es="1 · Dinámica" data-en="1 · Dynamics"></a><a href="t2.html" target="_top" data-es="2 · Trabajo y energía" data-en="2 · Work & energy"></a><a href="t3.html" target="_top" data-es="3 · Colisiones" data-en="3 · Collisions"></a><span class="cur" data-es="4 · Cinemática rot." data-en="4 · Rot. kinematics"></span><a href="t5.html" target="_top" data-es="5 · Dinámica rot." data-en="5 · Rot. dynamics"></a><a href="t6.html" target="_top" data-es="6 · Oscilaciones" data-en="6 · Oscillations"></a></div>
    <button id="langBtn"></button>
  </div>
  <nav id="tabs">
    <button data-s="r1" class="on" data-es="4.1 Las variables de la rotación" data-en="4.1 Rotational variables"></button>
    <button data-s="r2" data-es="4.2 Aceleración angular constante" data-en="4.2 Constant angular acceleration"></button>
    <button data-s="r3" data-es="4.3 Variables lineales y angulares (vectorial)" data-en="4.3 Linear and angular variables (vector form)"></button>
  </nav>
</header>
<main>

<!-- ============ R1 ============ -->
<section class="scene on" id="r1">
  <div class="stage"><div class="cvwrap"><canvas id="cr1"></canvas></div></div>
  <aside class="side">
    <h2 data-es="Posición, velocidad y aceleración angulares" data-en="Angular position, velocity and acceleration"></h2>
    <div class="concept">
      <p data-es="Un cuerpo rígido que gira alrededor de un eje fijo se describe con un solo ángulo θ, medido en <b>radianes</b>: el ángulo cuyo arco mide lo mismo que el radio." data-en="A rigid body rotating about a fixed axis is described by a single angle θ, measured in <b>radians</b>: the angle whose arc equals the radius."></p>
      <div class="eq">θ = s / r &nbsp;&nbsp; ω = dθ/dt &nbsp;&nbsp; α = dω/dt</div>
      <div class="eq">1 rev = 2π rad = 360° &nbsp;&nbsp; ω = 2π f &nbsp;&nbsp; T = 2π/ω</div>
      <p data-es="ω y α son vectores sobre el eje de giro, con la <b>regla de la mano derecha</b>: giro antihorario → ω sale de la pantalla (⊙); horario → entra (⊗)." data-en="ω and α are vectors along the rotation axis, by the <b>right-hand rule</b>: counter-clockwise → ω points out of the screen (⊙); clockwise → into it (⊗)."></p>
    </div>
    <h3 data-es="Controles" data-en="Controls"></h3>
    <div class="ctrls">
      <div class="row"><span>ω</span><input type="range" id="rr1w" min="-6" max="6" step="0.25" value="1"><output id="or1w"></output></div>
      <div class="hint" data-es="También puedes <b>girar el disco con el ratón</b>." data-en="You can also <b>spin the disk with the mouse</b>."></div>
      <label class="chk"><input type="checkbox" id="kr1rad" checked><span data-es="Mostrar «1 radián»" data-en="Show «1 radian»"></span></label>
      <div class="btns"><button class="btn" id="br1zero" data-es="θ = 0" data-en="θ = 0"></button><button class="btn" id="br1stop" data-es="Detener" data-en="Stop"></button></div>
    </div>
    <h3 data-es="Lecturas" data-en="Readings"></h3>
    <table class="ro" id="tr1"></table>
    <h3 data-es="Prueba esto en clase" data-en="Try this in class"></h3>
    <ul class="try">
      <li data-es="Activa «1 radián»: la cuña muestra un arco igual al radio (≈ 57.3°). Una vuelta tiene 2π ≈ 6.28 de esas cuñas." data-en="Turn on «1 radian»: the wedge shows an arc equal to the radius (≈ 57.3°). One turn holds 2π ≈ 6.28 such wedges."></li>
      <li data-es="Cambia el signo de ω y observa el símbolo ⊙/⊗ en el eje." data-en="Flip the sign of ω and watch the ⊙/⊗ symbol on the axis."></li>
      <li data-es="Convierte: 60 rpm = ? rad/s (respuesta: 2π ≈ 6.28)." data-en="Convert: 60 rpm = ? rad/s (answer: 2π ≈ 6.28)."></li>
    </ul>
  </aside>
</section>

<!-- ============ R2 ============ -->
<section class="scene" id="r2">
  <div class="stage">
    <div class="cvwrap"><canvas id="cr2"></canvas></div>
    <div class="cvwrap graph"><canvas id="gr2"></canvas></div>
  </div>
  <aside class="side">
    <h2 data-es="Rotación con aceleración angular constante" data-en="Rotation with constant angular acceleration"></h2>
    <div class="concept">
      <p data-es="Las ecuaciones son las mismas que las del movimiento rectilíneo uniformemente acelerado, cambiando x → θ, v → ω, a → α:" data-en="The equations are the same as for straight-line motion with constant acceleration, with x → θ, v → ω, a → α:"></p>
      <div class="eq">ω = ω₀ + α t<br>θ = θ₀ + ω₀ t + ½ α t²<br>ω² = ω₀² + 2α(θ − θ₀)</div>
      <p class="hint" data-es="Lineal ↔ rotacional: x ↔ θ, v ↔ ω, a ↔ α." data-en="Linear ↔ rotational: x ↔ θ, v ↔ ω, a ↔ α."></p>
    </div>
    <h3 data-es="Controles" data-en="Controls"></h3>
    <div class="ctrls">
      <div class="row"><span>ω₀</span><input type="range" id="rr2w" min="-5" max="5" step="0.25" value="0"><output id="or2w"></output></div>
      <div class="row"><span>α</span><input type="range" id="rr2a" min="-3" max="3" step="0.1" value="1"><output id="or2a"></output></div>
      <div class="btns">
        <button class="btn primary" id="br2run"></button>
        <button class="btn" id="br2reset" data-es="Reiniciar" data-en="Reset"></button>
      </div>
    </div>
    <h3 data-es="Lecturas y verificación" data-en="Readings and check"></h3>
    <table class="ro" id="tr2"></table>
    <h3 data-es="Prueba esto en clase" data-en="Try this in class"></h3>
    <ul class="try">
      <li data-es="ω(t) es una recta de pendiente α; θ(t) es una parábola." data-en="ω(t) is a straight line with slope α; θ(t) is a parabola."></li>
      <li data-es="Un ventilador que frena: ω₀ = 5 rad/s, α = −1 rad/s². ¿Cuántas vueltas da antes de parar? (θ = ω₀²/2|α| = 12.5 rad ≈ 2 vueltas)." data-en="A fan slowing down: ω₀ = 5 rad/s, α = −1 rad/s². How many turns before stopping? (θ = ω₀²/2|α| = 12.5 rad ≈ 2 turns)."></li>
      <li data-es="Si α es opuesta a ω₀, el disco frena, se detiene y luego gira al revés." data-en="If α opposes ω₀, the disk slows, stops, then spins the other way."></li>
    </ul>
  </aside>
</section>

<!-- ============ R3 ============ -->
<section class="scene" id="r3">
  <div class="stage"><div class="cvwrap"><canvas id="cr3"></canvas></div></div>
  <aside class="side">
    <h2 data-es="Relación entre variables lineales y angulares" data-en="Linking linear and angular variables"></h2>
    <div class="concept">
      <p data-es="Todos los puntos del disco tienen el mismo ω y α, pero su velocidad lineal depende de la distancia al eje. En forma vectorial (con <b>ω</b> y <b>α</b> sobre el eje):" data-en="Every point on the disk shares the same ω and α, but its linear velocity depends on the distance to the axis. In vector form (with <b>ω</b> and <b>α</b> along the axis):"></p>
      <div class="eq"><b>v</b> = <b>ω</b> × <b>r</b><br><b>a</b> = <b>α</b> × <b>r</b> − ω² <b>r</b> = <b>a</b><sub>t</sub> + <b>a</b><sub>c</sub></div>
      <div class="eq">v = ω r &nbsp;&nbsp; a<sub>t</sub> = α r &nbsp;&nbsp; a<sub>c</sub> = ω² r = v²/r</div>
      <p data-es="El producto cruz hace que <b>v</b> sea perpendicular a <b>r</b> (tangente al círculo)." data-en="The cross product makes <b>v</b> perpendicular to <b>r</b> (tangent to the circle)."></p>
    </div>
    <h3 data-es="Controles" data-en="Controls"></h3>
    <div class="ctrls">
      <div class="hint" data-es="Arrastra el punto P para cambiar su distancia al eje." data-en="Drag point P to change its distance to the axis."></div>
      <div class="row"><span>ω₀</span><input type="range" id="rr3w" min="-3" max="3" step="0.25" value="1.5"><output id="or3w"></output></div>
      <div class="row"><span>α</span><input type="range" id="rr3a" min="-1.5" max="1.5" step="0.1" value="0"><output id="or3a"></output></div>
      <label class="chk"><input type="checkbox" id="kr3prof" checked><span data-es="Mostrar perfil v ∝ r a lo largo del radio" data-en="Show v ∝ r profile along the radius"></span></label>
      <div class="btns">
        <button class="btn primary" id="br3run"></button>
        <button class="btn" id="br3reset" data-es="Reiniciar ω" data-en="Reset ω"></button>
      </div>
      <div class="legend"><span style="--c:#1c7ed6">v</span><span style="--c:#2f9e44">a<sub>c</sub></span><span style="--c:#f08c00">a<sub>t</sub></span><span style="--c:#6741d9" data-es="a total" data-en="total a"></span><span style="--c:#1d2329">r</span></div>
    </div>
    <h3 data-es="Lecturas (punto P)" data-en="Readings (point P)"></h3>
    <table class="ro" id="tr3"></table>
    <h3 data-es="Prueba esto en clase" data-en="Try this in class"></h3>
    <ul class="try">
      <li data-es="Con α = 0 solo hay aceleración centrípeta. Pon α ≠ 0 y aparece la tangencial: <b>a</b> total ya no apunta al centro." data-en="With α = 0 there's only centripetal acceleration. Set α ≠ 0 and the tangential part appears: total <b>a</b> no longer points to the center."></li>
      <li data-es="El perfil muestra que v crece linealmente con r: la orilla de un disco duro o un CD va mucho más rápido que el centro." data-en="The profile shows v grows linearly with r: the rim of a hard drive or CD moves much faster than near the center."></li>
      <li data-es="Duplica r: v y a<sub>t</sub> se duplican, a<sub>c</sub> también (ω fija)." data-en="Double r: v and a<sub>t</sub> double, and so does a<sub>c</sub> (fixed ω)."></li>
    </ul>
  </aside>
</section>

</main>
<script src="lib/three.min.js"></script><script src="lib/three-extras.js"></script><script>

const PAL_L = {...C}, PAL_D = {F: '#ff6b6b', a: '#69db7c', v: '#4dabf7', R: '#b197fc', fr: '#ffa94d', ink: '#f1f3f5', muted: '#a5adb5', grid: 'rgba(255,255,255,.08)', axis: 'rgba(255,255,255,.3)', teal: '#3bc9db'};
let DARK = false;
function setDark(on) { if (on === DARK) return; DARK = on; Object.assign(C, on ? PAL_D : PAL_L); }

function setupCanvas(cv) {
  const o = {cv, ctx: cv.getContext('2d'), w: 1, h: 1};
  const ro = new ResizeObserver(() => {
    const r = cv.parentElement.getBoundingClientRect(), d = window.devicePixelRatio || 1;

function ptr(e, cv) { const r = cv.getBoundingClientRect(); return {x: e.clientX - r.left, y: e.clientY - r.top}; }

function arrow(ctx, x0, y0, x1, y1, col, w = 3, dash = null, alpha = 1) {
  const dx = x1 - x0, dy = y1 - y0, Ln = Math.hypot(dx, dy);
  if (Ln < 1.5) return;
  const ux = dx / Ln, uy = dy / Ln, hl = Math.min(10 + w * 2.2, Ln * 0.55), hw = hl * 0.48;
  ctx.save(); ctx.globalAlpha = alpha; ctx.strokeStyle = col; ctx.fillStyle = col; ctx.lineWidth = w; ctx.lineCap = 'round';

      ['Arrastra P de r = 2 m a r = 1 m y compara las lecturas.', 'Drag P from r = 2 m to r = 1 m and compare the readings.']],
    ans: ['Orilla: 3 m/s y 4.5 m/s². Mitad: 1.5 m/s y 2.25 m/s². La aceleración apunta al eje.', 'Edge: 3 m/s and 4.5 m/s². Halfway: 1.5 m/s and 2.25 m/s². The acceleration points to the axis.'],
    load() { setR('rr3w', 1.5); setR('rr3a', 0); r3.rP = 2; r3.run = true; r3.btn(); }}
};
addProblems(PROB, {r1, r2, r3});

addRetos([
  {tab: 'r2', title: ['Vueltas de una centrífuga', 'Turns of a centrifuge'],
   text: ['Un disco gira a ω₀ = 2 rad/s y empieza a acelerar con α = 0.5 rad/s² constante.', 'A disk spins at ω₀ = 2 rad/s and starts accelerating with constant α = 0.5 rad/s².'],
   q: ['¿Cuántas vueltas completa en los primeros 6 s?', 'How many turns does it complete in the first 6 s?'], unit: L('vueltas', 'turns'), answer: 3.342, tol: 0.03,
   hint: ['θ = ω₀ t + ½ α t², y luego divide entre 2π.', 'θ = ω₀ t + ½ α t², then divide by 2π.'],
   steps: [['θ = 2 × 6 + ½ × 0.5 × 36 = 12 + 9 = 21 rad.', 'θ = 2 × 6 + ½ × 0.5 × 36 = 12 + 9 = 21 rad.'], ['Vueltas = 21 / 2π.', 'Turns = 21 / 2π.']],
   ans: ['≈ 3.34 vueltas', '≈ 3.34 turns'],
   setup() { r2.run = false; setR('rr2w', 2); setR('rr2a', 0.5); r2.reset(); r2.run = true; r2.btn(); },

  {tab: 'r3', title: ['El niño en la orilla del carrusel', 'The kid at the edge of the merry-go-round'],

   q: ['¿Cuál es la magnitud de la aceleración del niño a los 2 s?', 'What is the magnitude of the kid\'s acceleration at 2 s?'], unit: 'm/s²', answer: 8.062, tol: 0.03,
   hint: ['a los 2 s, ω = ω₀ + α t; combina aᶜ = ω² r con aₜ = α r (son perpendiculares).', 'at 2 s, ω = ω₀ + α t; combine aᶜ = ω² r with aₜ = α r (they are perpendicular).'],
   steps: [['ω(2 s) = 1 + 0.5 × 2 = 2 rad/s.', 'ω(2 s) = 1 + 0.5 × 2 = 2 rad/s.'], ['aᶜ = ω² r = 4 × 2 = 8 m/s²; aₜ = α r = 1 m/s².', 'aᶜ = ω² r = 4 × 2 = 8 m/s²; aₜ = α r = 1 m/s².'], ['|a| = √(8² + 1²).', '|a| = √(8² + 1²).']],
   ans: ['|a| ≈ 8.06 m/s²', '|a| ≈ 8.06 m/s²'],
   setup() { setR('rr3w', 1); setR('rr3a', 0.5); r3.rP = 2; r3.w = 1; r3.t = 0; r3.stopAt = 0; r3.run = true; r3.btn(); },
   preview: 700, pause() { r3.run = false; r3.btn(); }, reveal() { r3.stopAt = 2; r3.run = true; r3.btn(); },

]);

startApp({r1, r2, r3});
}
